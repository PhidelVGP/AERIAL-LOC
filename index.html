<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHIDEL VGP — Documents</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
    color: #173f60;
}

/* =========================
   EN-TÊTE
========================= */

header {
    background: white;
    padding: 38px 20px 42px;
}

.logo {
    text-align: center;
    color: #e30613;
    font-size: 43px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 34px;
}

.search-container {
    width: min(760px, 92%);
    margin: auto;
}

#search {
    width: 100%;
    height: 58px;
    border: 1px solid #cfd9df;
    border-radius: 32px;
    padding: 0 25px;
    font-size: 16px;
    outline: none;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

#search:focus {
    border-color: #1688d8;
}

/* =========================
   ZONE DOCUMENTS
========================= */

.documents-area {
    background: #dff2ff;
    min-height: calc(100vh - 210px);
    padding: 35px 15px 70px;
    border-radius: 38px 38px 0 0;
}

.documents-title {
    text-align: center;
    margin: 0 0 30px;
    font-size: 27px;
    color: #16496d;
    font-weight: 800;
}

#documents {
    width: min(900px, 100%);
    margin: auto;
}

/* =========================
   CARTE PDF
========================= */

.document-card {
    background: white;
    border-radius: 17px;
    min-height: 104px;
    margin-bottom: 15px;
    padding: 17px 20px;

    display: flex;
    align-items: center;
    gap: 17px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

/* Icône PDF */

.pdf-icon {
    width: 61px;
    height: 66px;
    flex-shrink: 0;

    background: #e30613;
    color: white;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
    font-weight: bold;
}

/* Informations */

.document-info {
    flex: 1;
    min-width: 0;
}

.document-name {
    color: #183f60;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
}

.date {
    color: #596a76;
    font-size: 13px;
    margin-top: 4px;
}

/* Badge NEW */

.new-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 8px;

    background: #e30613;
    color: white;

    border-radius: 12px;

    font-size: 9px;
    font-weight: bold;
    vertical-align: middle;
}

/* Bouton */

.download {
    flex-shrink: 0;

    background: #1688d8;
    color: white;

    text-decoration: none;

    padding: 12px 18px;
    border-radius: 10px;

    font-size: 13px;
    font-weight: bold;

    min-width: 118px;
    text-align: center;
}

.download:hover {
    background: #0876c4;
}

/* Messages */

.loading {
    text-align: center;
    padding: 50px 15px;
    color: #61717c;
}

.error {
    text-align: center;
    padding: 40px 15px;
    color: #c90000;
    font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .logo {
        font-size: 32px;
    }

    .documents-area {
        border-radius: 28px 28px 0 0;
        padding-left: 10px;
        padding-right: 10px;
    }

    .document-card {
        flex-wrap: wrap;
        padding: 15px;
    }

    .document-info {
        width: calc(100% - 80px);
    }

    .download {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        PHIDEL VGP
    </div>

    <div class="search-container">
        <input
            id="search"
            type="text"
            placeholder="Rechercher un document..."
            autocomplete="off"
        >
    </div>

</header>


<section class="documents-area">

    <h1 class="documents-title">
        Documents disponibles
    </h1>

    <div id="documents">

        <div class="loading">
            Chargement des documents...
        </div>

    </div>

</section>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";


const documentsBox =
    document.getElementById("documents");

const searchBox =
    document.getElementById("search");


let documents = [];


/* =========================================================
   NETTOYAGE DU NOM
========================================================= */

function cleanName(name) {

    return name
        .replace(/\.pdf$/i, "")
        .trim();

}


/* =========================================================
   NORMALISATION DATE
========================================================= */

function normalizeDate(date) {

    if (!date) {
        return null;
    }

    let d = date
        .replace(/\s+/g, "")
        .replace(/[.\-]/g, "/");

    const parts = d.split("/");

    if (parts.length !== 3) {
        return d;
    }

    let day = parts[0];
    let month = parts[1];
    let year = parts[2];

    if (day.length === 1) {
        day = "0" + day;
    }

    if (month.length === 1) {
        month = "0" + month;
    }

    if (year.length === 2) {
        year = "20" + year;
    }

    return `${day}/${month}/${year}`;
}


/* =========================================================
   RECHERCHE DES DATES
========================================================= */

function findDates(text) {

    if (!text) {
        return {
            verified: null,
            nextCheck: null
        };
    }

    let t = text
        .replace(/\u00a0/g, " ")
        .replace(/\r/g, " ")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ");


    /*
       Date acceptée :

       11/08/2026
       11-08-2026
       11.08.2026
       11 / 08 / 2026
    */

    const date =
        "(\\d{1,2}\\s*[\\/\\.\\-]\\s*\\d{1,2}\\s*[\\/\\.\\-]\\s*\\d{2,4})";


    let verified = null;
    let nextCheck = null;


    /* =========================
       VÉRIFIÉ LE
    ========================= */

    const verifiedPatterns = [

        new RegExp(
            "v[ée]rifi[ée]e?\\s*(?:le)?\\s*:?\\s*" + date,
            "i"
        ),

        new RegExp(
            "verifi[ée]e?\\s*(?:le)?\\s*:?\\s*" + date,
            "i"
        ),

        new RegExp(
            "v[ée]rif\\w*\\s*(?:le)?\\s*:?\\s*" + date,
            "i"
        )

    ];


    for (const regex of verifiedPatterns) {

        const match = t.match(regex);

        if (match) {

            verified =
                normalizeDate(match[1]);

            break;
        }
    }


    /* =========================
       À VÉRIFIER AVANT LE
    ========================= */

    const nextPatterns = [

        new RegExp(
            "[àa]\\s*v[ée]rifi[ée]e?\\s*avant\\s*(?:le)?\\s*:?\\s*" + date,
            "i"
        ),

        new RegExp(
            "verifi[ée]e?\\s*avant\\s*(?:le)?\\s*:?\\s*" + date,
            "i"
        ),

        new RegExp(
            "prochaine\\s*v[ée]rifi[ée]e?\\s*:?\\s*" + date,
            "i"
        ),

        new RegExp(
            "date\\s*suivante\\s*:?\\s*" + date,
            "i"
        )

    ];


    for (const regex of nextPatterns) {

        const match = t.match(regex);

        if (match) {

            nextCheck =
                normalizeDate(match[1]);

            break;
        }
    }


    return {
        verified,
        nextCheck
    };
}


/* =========================================================
   CHARGEMENT PDF.JS
========================================================= */

async function loadPDFJS() {

    if (window.pdfjsLib) {
        return window.pdfjsLib;
    }

    const script =
        document.createElement("script");

    script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    /*
       PDF.js moderne est chargé
       directement dans readPDF().
    */

}


/* =========================================================
   LECTURE DU PDF
========================================================= */

async function readPDF(url) {

    try {

        const pdfjsLib =
            await import(
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            );


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const pdf =
            await pdfjsLib
                .getDocument({
                    url: url,
                    disableAutoFetch: false,
                    disableStream: false
                })
                .promise;


        let fullText = "";


        /*
           On lit les 15 premières pages maximum.
        */

        const maxPages =
            Math.min(pdf.numPages, 15);


        for (
            let pageNumber = 1;
            pageNumber <= maxPages;
            pageNumber++
        ) {

            const page =
                await pdf.getPage(pageNumber);


            const content =
                await page.getTextContent();


            const pageText =
                content.items
                    .map(item => item.str)
                    .join(" ");


            fullText +=
                " " + pageText;


            const dates =
                findDates(fullText);


            if (
                dates.verified &&
                dates.nextCheck
            ) {

                return {
                    verified: dates.verified,
                    nextCheck: dates.nextCheck
                };
            }
        }


        return findDates(fullText);

    }

    catch (error) {

        console.log(
            "Lecture PDF impossible :",
            error
        );


        return {
            verified: null,
            nextCheck: null
        };
    }
}


/* =========================================================
   OCR
========================================================= */

let ocrWorker = null;


/* =========================================================
   OCR D'UNE PAGE
========================================================= */

async function OCRPage(page) {

    const viewport =
        page.getViewport({
            scale: 3
        });


    const canvas =
        document.createElement("canvas");


    canvas.width =
        Math.floor(viewport.width);

    canvas.height =
        Math.floor(viewport.height);


    const context =
        canvas.getContext("2d");


    await page.render({
        canvasContext: context,
        viewport: viewport
    }).promise;


    const result =
        await ocrWorker.recognize(
            canvas
        );


    return result.data.text;
}


/* =========================================================
   OCR DU PDF
========================================================= */

async function OCRPDF(url) {

    try {

        if (!window.Tesseract) {
            return {
                verified: null,
                nextCheck: null
            };
        }


        if (!ocrWorker) {

            ocrWorker =
                await Tesseract.createWorker(
                    "fra"
                );
        }


        const pdfjsLib =
            await import(
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            );


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const pdf =
            await pdfjsLib
                .getDocument({
                    url: url
                })
                .promise;


        let fullText = "";


        const maxPages =
            Math.min(pdf.numPages, 15);


        for (
            let pageNumber = 1;
            pageNumber <= maxPages;
            pageNumber++
        ) {

            const page =
                await pdf.getPage(pageNumber);


            const text =
                await OCRPage(page);


            fullText +=
                " " + text;


            const dates =
                findDates(fullText);


            if (
                dates.verified &&
                dates.nextCheck
            ) {

                return dates;
            }
        }


        return findDates(fullText);

    }

    catch (error) {

        console.log(
            "OCR impossible :",
            error
        );


        return {
            verified: null,
            nextCheck: null
        };
    }
}


/* =========================================================
   LECTURE DES DATES
========================================================= */

async function getDates(url) {

    /*
       Première tentative :
       lecture normale du texte PDF.
    */

    const normal =
        await readPDF(url);


    if (
        normal.verified &&
        normal.nextCheck
    ) {

        return normal;
    }


    /*
       Si le PDF est un scan :
       OCR.
    */

    const ocr =
        await OCRPDF(url);


    return {

        verified:
            normal.verified ||
            ocr.verified,

        nextCheck:
            normal.nextCheck ||
            ocr.nextCheck

    };
}


/* =========================================================
   AFFICHAGE
========================================================= */

function display(list) {

    documentsBox.innerHTML = "";


    if (list.length === 0) {

        documentsBox.innerHTML = `
            <div class="loading">
                Aucun document trouvé.
            </div>
        `;

        return;
    }


    list.forEach(doc => {

        const card =
            document.createElement("div");

        card.className =
            "document-card";


        const downloaded =
            localStorage.getItem(
                "phidelvgp_downloaded_" + doc.name
            ) === "true";


        const badge =
            downloaded
                ? ""
                : `<span class="new-badge">NEW</span>`;


        const pdfURL =
            SITE +
            encodeURIComponent(
                doc.name
            );


        card.innerHTML = `

            <div class="pdf-icon">
                PDF
            </div>

            <div class="document-info">

                <div class="document-name">
                    ${cleanName(doc.name)}
                    ${badge}
                </div>

                <div class="date">
                    Vérifié le :
                    ${
                        doc.verified
                        || "lecture en cours..."
                    }
                </div>

                <div class="date">
                    À vérifier avant le :
                    ${
                        doc.nextCheck
                        || "lecture en cours..."
                    }
                </div>

            </div>

            <a
                class="download"
                href="${pdfURL}"
                download="${doc.name}"
            >
                Télécharger
            </a>
        `;


        const button =
            card.querySelector(
                ".download"
            );


        button.addEventListener(
            "click",
            function () {

                localStorage.setItem(
                    "phidelvgp_downloaded_" + doc.name,
                    "true"
                );


                const badge =
                    card.querySelector(
                        ".new-badge"
                    );


                if (badge) {
                    badge.remove();
                }
            }
        );


        documentsBox.appendChild(card);

    });
}


/* =========================================================
   CHARGEMENT DES PDF DEPUIS GITHUB
========================================================= */

async function loadDocuments() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {
            throw new Error(
                "GitHub inaccessible"
            );
        }


        const files =
            await response.json();


        /*
           Tous les PDF présents à la racine
           du dépôt sont automatiquement détectés.
        */

        documents =
            files
                .filter(file =>
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".pdf")
                )
                .map(file => ({

                    name: file.name,

                    verified: null,

                    nextCheck: null

                }));


        /*
           Affichage immédiat.
        */

        display(documents);


        /*
           Chargement de Tesseract
           uniquement pour les PDF scannés.
        */

        const tesseractScript =
            document.createElement("script");


        tesseractScript.src =
            "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";


        document.head.appendChild(
            tesseractScript
        );


        /*
           On attend que Tesseract soit disponible.
        */

        await new Promise(resolve => {

            if (window.Tesseract) {
                resolve();
                return;
            }


            tesseractScript.onload =
                resolve;

            tesseractScript.onerror =
                resolve;

        });


        /*
           Lecture de chaque PDF.
        */

        for (
            const doc of documents
        ) {

            const url =
                SITE +
                encodeURIComponent(
                    doc.name
                );


            const dates =
                await getDates(url);


            doc.verified =
                dates.verified;


            doc.nextCheck =
                dates.nextCheck;


            display(
                filterDocuments()
            );
        }

    }

    catch (error) {

        console.error(error);


        documentsBox.innerHTML = `

            <div class="error">

                Impossible de charger les documents.

                <br><br>

                Vérifie que le dépôt GitHub
                est public et que GitHub Pages
                est activé.

            </div>

        `;
    }
}


/* =========================================================
   RECHERCHE
========================================================= */

function filterDocuments() {

    const value =
        searchBox.value
            .toLowerCase()
            .trim();


    if (!value) {
        return documents;
    }


    return documents.filter(doc =>
        doc.name
            .toLowerCase()
            .includes(value)
    );
}


searchBox.addEventListener(
    "input",
    function () {

        display(
            filterDocuments()
        );
    }
);


/* =========================================================
   DÉMARRAGE
========================================================= */

loadDocuments();

</script>

</body>
</html>
