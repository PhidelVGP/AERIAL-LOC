<body>

<header>

    <!-- CHARIOT ÉLÉVATEUR -->
    <div class="forklift">

        <div class="roof"></div>
        <div class="roof-left"></div>
        <div class="roof-right"></div>

        <div class="seat"></div>

        <div class="body"></div>

        <div class="mast2"></div>

        <div class="fork1"></div>
        <div class="fork2"></div>

        <div class="wheel wheel1"></div>
        <div class="wheel wheel2"></div>

    </div>


    <!-- LOGO -->
    <div class="logo">
        PHIDEL VGP
    </div>


    <!-- NACELLE -->
    <div class="lift">

        <div class="base"></div>

        <div class="boom1"></div>
        <div class="boom2"></div>

        <div class="wheel wheel2"></div>

    </div>


    <!-- RECHERCHE -->
    <div class="search-wrap">

        <input
            id="search"
            type="text"
            placeholder="Rechercher un document..."
            autocomplete="off"
        >

    </div>

</header>


<section class="documents-area">

    <h1 class="documents-title">
        Documents disponibles
    </h1>

    <div id="documents">

        <div class="loading">
            Chargement des documents...
        </div>

    </div>

</section>


<script type="module">

const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";

const documentsBox =
    document.getElementById("documents");

const searchBox =
    document.getElementById("search");

let documents = [];

let ocrWorker = null;


/* =========================================================
   NOM
========================================================= */

function cleanName(name){

    return name
        .replace(/\.pdf$/i,"")
        .trim();

}


/* =========================================================
   NORMALISATION D'UNE DATE
========================================================= */

function normalizeDate(value){

    return value
        .replace(/\s+/g,"")
        .replace(/[.\-]/g,"/");

}


/* =========================================================
   EXTRACTION DES DATES
========================================================= */

function findDates(text){

    if(!text){
        return {
            verified:null,
            nextCheck:null
        };
    }


    let t =
        text
            .replace(/\u00a0/g," ")
            .replace(/\r/g," ")
            .replace(/\n/g," ")
            .replace(/\s+/g," ");


    /*
       On accepte les erreurs fréquentes de l'OCR :

       Vérifié
       Vérifie
       Verifie
       Verif
       Vérification
    */

    const date =
        "(\\d{1,2}\\s*[\\/.\\-]\\s*\\d{1,2}\\s*[\\/.\\-]\\s*\\d{2,4})";


    let verified = null;
    let nextCheck = null;


    const verifiedPatterns = [

        new RegExp(
            "v[ée]rifi[ée]e?\\s*(?:le)?\\s*:?\\s*"+date,
            "i"
        ),

        new RegExp(
            "verifi[ée]e?\\s*(?:le)?\\s*:?\\s*"+date,
            "i"
        ),

        new RegExp(
            "v[ée]rif\\w*\\s*(?:le)?\\s*:?\\s*"+date,
            "i"
        )

    ];


    for(const regex of verifiedPatterns){

        const match =
            t.match(regex);

        if(match){

            verified =
                normalizeDate(match[1]);

            break;

        }

    }


    const nextPatterns = [

        new RegExp(
            "[àa]\\s*v[ée]rifi[ée]e?\\s*avant\\s*(?:le)?\\s*:?\\s*"+date,
            "i"
        ),

        new RegExp(
            "verifi[ée]e?\\s*avant\\s*(?:le)?\\s*:?\\s*"+date,
            "i"
        ),

        new RegExp(
            "prochaine\\s*v[ée]rifi[ée]e?\\s*:?\\s*"+date,
            "i"
        ),

        new RegExp(
            "date\\s*suivante\\s*:?\\s*"+date,
            "i"
        )

    ];


    for(const regex of nextPatterns){

        const match =
            t.match(regex);

        if(match){

            nextCheck =
                normalizeDate(match[1]);

            break;

        }

    }


    /*
       Si l'OCR a cassé les mots,
       on cherche les dates présentes
       autour des mots importants.
    */

    if(!verified){

        const allDates =
            [...t.matchAll(
                /\b\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{2,4}\b/g
            )];


        for(const match of allDates){

            const position =
                match.index;

            const before =
                t.substring(
                    Math.max(0,position-100),
                    position
                ).toLowerCase();


            if(
                before.includes("verif") ||
                before.includes("vérif")
            ){

                verified =
                    normalizeDate(match[0]);

                break;

            }

        }

    }


    if(!nextCheck){

        const allDates =
            [...t.matchAll(
                /\b\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{2,4}\b/g
            )];


        for(const match of allDates){

            const position =
                match.index;

            const before =
                t.substring(
                    Math.max(0,position-120),
                    position
                ).toLowerCase();


            if(
                before.includes("avant") ||
                before.includes("suivante")
            ){

                nextCheck =
                    normalizeDate(match[0]);

                break;

            }

        }

    }


    return {
        verified,
        nextCheck
    };

}


/* =========================================================
   PDF.JS
========================================================= */

async function getPDF(url){

    const pdfjsLib =
        await import(
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        );


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    return await pdfjsLib
        .getDocument({
            url:url,
            disableAutoFetch:false,
            disableStream:false
        })
        .promise;

}


/* =========================================================
   TEXTE DIRECT DU PDF
========================================================= */

async function readPDFText(url){

    try{

        const pdf =
            await getPDF(url);


        let fullText = "";


        /*
           On va jusqu'à 15 pages.
        */

        const max =
            Math.min(
                pdf.numPages,
                15
            );


        for(
            let pageNumber=1;
            pageNumber<=max;
            pageNumber++
        ){

            const page =
                await pdf.getPage(pageNumber);


            const content =
                await page.getTextContent();


            const text =
                content.items
                    .map(item=>item.str)
                    .join(" ");


            fullText +=
                " " + text;


            const dates =
                findDates(fullText);


            if(
                dates.verified &&
                dates.nextCheck
            ){

                return {
                    pdf,
                    ...dates
                };

            }

        }


        return {
            pdf,
            ...findDates(fullText)
        };


    }catch(error){

        console.log(
            "PDF texte:",
            error
        );


        return {
            pdf:null,
            verified:null,
            nextCheck:null
        };

    }

}


/* =========================================================
   OCR D'UNE PAGE
========================================================= */

async function OCRPage(page){

    const viewport =
        page.getViewport({
            scale:2.5
        });


    const canvas =
        document.createElement("canvas");


    canvas.width =
        Math.floor(viewport.width);

    canvas.height =
        Math.floor(viewport.height);


    const ctx =
        canvas.getContext("2d",{
            willReadFrequently:true
        });


    await page.render({

        canvasContext:ctx,
        viewport:viewport

    }).promise;


    /*
       Amélioration du contraste
       pour les PDF scannés.
    */

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        image.data;


    for(
        let i=0;
        i<data.length;
        i+=4
    ){

        const grey =
            (
                data[i] * .299 +
                data[i+1] * .587 +
                data[i+2] * .114
            );


        let value;


        if(grey>205){

            value=255;

        }else if(grey<100){

            value=0;

        }else{

            value=grey;

        }


        data[i]=value;
        data[i+1]=value;
        data[i+2]=value;

    }


    ctx.putImageData(
        image,
        0,
        0
    );


    const result =
        await ocrWorker.recognize(
            canvas
        );


    return result.data.text;

}


/* =========================================================
   OCR DU PDF
========================================================= */

async function readPDFOCR(pdf){

    try{

        if(!pdf){
            return {
                verified:null,
                nextCheck:null
            };
        }


        if(!ocrWorker){

            ocrWorker =
                await window.Tesseract.createWorker(
                    "fra"
                );

        }


        let fullText = "";


        /*
           Jusqu'à 15 pages.
           On s'arrête dès que les deux dates
           sont trouvées.
        */

        const max =
            Math.min(
                pdf.numPages,
                15
            );


        for(
            let pageNumber=1;
            pageNumber<=max;
            pageNumber++
        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );


            const text =
                await OCRPage(page);


            fullText +=
                " " + text;


            const dates =
                findDates(fullText);


            if(
                dates.verified &&
                dates.nextCheck
            ){

                return dates;

            }

        }


        return findDates(fullText);


    }catch(error){

        console.log(
            "OCR:",
            error
        );


        return {
            verified:null,
            nextCheck:null
        };

    }

}


/* =========================================================
   LECTURE DES DATES
========================================================= */

async function readDates(url){

    /*
       1 — lecture normale du PDF
    */

    const native =
        await readPDFText(url);


    if(
        native.verified &&
        native.nextCheck
    ){

        return {
            verified:native.verified,
            nextCheck:native.nextCheck
        };

    }


    /*
       2 — OCR si nécessaire
    */

    const ocr =
        await readPDFOCR(
            native.pdf
        );


    return {

        verified:
            native.verified ||
            ocr.verified,

        nextCheck:
            native.nextCheck ||
            ocr.nextCheck

    };

}


/* =========================================================
   AFFICHAGE
========================================================= */

function display(list){

    documentsBox.innerHTML = "";


    if(list.length===0){

        documentsBox.innerHTML =
            `<div class="loading">
                Aucun document trouvé.
            </div>`;

        return;

    }


    list.forEach(doc=>{

        const card =
            document.createElement("div");


        card.className =
            "document-card";


        const downloaded =
            localStorage.getItem(
                "phidelvgp_downloaded_"+doc.name
            ) === "true";


        const badge =
            downloaded
            ? ""
            : `<span class="new-badge">NEW</span>`;


        const url =
            SITE +
            encodeURIComponent(
                doc.name
            );


        card.innerHTML = `

            <div class="pdf-icon">
                PDF
            </div>

            <div class="document-info">

                <div class="document-name">
                    ${cleanName(doc.name)}
                    ${badge}
                </div>

                <div class="date">
                    Vérifié le :
                    ${doc.verified || "lecture en cours..."}
                </div>

                <div class="date">
                    À vérifier avant le :
                    ${doc.nextCheck || "lecture en cours..."}
                </div>

            </div>

            <a
                class="download"
                href="${url}"
                download="${doc.name}"
            >
                Télécharger
            </a>

        `;


        card
            .querySelector(".download")
            .addEventListener(
                "click",
                ()=>{

                    localStorage.setItem(
                        "phidelvgp_downloaded_"+doc.name,
                        "true"
                    );


                    const badge =
                        card.querySelector(
                            ".new-badge"
                        );


                    if(badge){
                        badge.remove();
                    }

                }
            );


        documentsBox.appendChild(card);

    });

}


/* =========================================================
   CHARGEMENT GITHUB
========================================================= */

async function loadDocuments(){

    try{

        const response =
            await fetch(API);


        if(!response.ok){

            throw new Error(
                "GitHub inaccessible"
            );

        }


        const files =
            await response.json();


        documents =
            files
                .filter(file =>
                    file.type==="file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".pdf")
                )
                .map(file=>({

                    name:file.name,
                    verified:null,
                    nextCheck:null

                }));


        display(documents);


        /*
           Lecture de chaque PDF.
        */

        for(
            const doc of documents
        ){

            const url =
                SITE +
                encodeURIComponent(
                    doc.name
                );


            const dates =
                await readDates(url);


            doc.verified =
                dates.verified;


            doc.nextCheck =
                dates.nextCheck;


            display(
                filterDocuments()
            );

        }


    }catch(error){

        console.error(error);


        documentsBox.innerHTML = `

            <div class="error">

                Impossible de charger les documents.

                <br><br>

                Vérifie que le dépôt GitHub
                est public.

            </div>

        `;

    }

}


/* =========================================================
   RECHERCHE
========================================================= */

function filterDocuments(){

    const value =
        searchBox.value
            .toLowerCase()
            .trim();


    if(!value){
        return documents;
    }


    return documents.filter(doc =>
        doc.name
            .toLowerCase()
            .includes(value)
    );

}


searchBox.addEventListener(
    "input",
    ()=>{
        display(
            filterDocuments()
        );
    }
);


/* =========================================================
   TESSERACT
========================================================= */

const tesseractScript =
    document.createElement("script");


tesseractScript.src =
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";


tesseractScript.onload =
    ()=>{
        loadDocuments();
    };


tesseractScript.onerror =
    ()=>{
        documentsBox.innerHTML = `
            <div class="error">
                Impossible de charger la lecture des PDF.
            </div>
        `;
    };


document.head.appendChild(
    tesseractScript
);

</script>

</body>
