<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Phidel VGP — Documents</title>


<style>

body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
}


.header {
    padding: 15px 20px;
    border-bottom: 2px solid #eee;
    font-size: 22px;
    font-weight: bold;
    color: red;
}


.container {
    padding: 20px;
    max-width: 700px;
    margin: auto;
}


.search-box {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}


.file {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: #fafafa;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
}


.file-name {
    font-size: 18px;
    font-weight: bold;
}


.validity {
    font-size: 14px;
    color: #666;
    margin-top: 5px;
    line-height: 1.5;
}


.download-btn {
    background: #007bff;
    color: white;
    padding: 10px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}


.download-btn:hover {
    background: #0056b3;
}


.new-badge {
    background: red;
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    margin-left: 10px;
}


.status {
    color: #666;
    margin-bottom: 15px;
}


.loading {
    color: #007bff;
}


.error {
    color: red;
}


</style>

</head>


<body>


<div class="header">
    Phidel VGP
</div>


<div class="container">


<input
    id="search"
    class="search-box"
    type="text"
    placeholder="Rechercher un fichier..."
    oninput="searchFiles()"
>


<div
    id="status"
    class="status"
>
    Chargement des documents...
</div>


<div id="files-container"></div>


</div>



<!-- PDF.JS -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";



/* =========================================================
   CONFIGURATION
   ========================================================= */


const OWNER =
    "PhidelVGP";


const REPO =
    "AERIAL-LOC";


const BRANCH =
    "main";


const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";



let files = [];



const filesContainer =
    document.getElementById(
        "files-container"
    );


const status =
    document.getElementById(
        "status"
    );



/* =========================================================
   URL DES PDF
   ========================================================= */


function fileUrl(name) {

    return (
        SITE +
        encodeURIComponent(name)
    );

}



/* =========================================================
   RÉCUPÉRATION AUTOMATIQUE DES PDF
   ========================================================= */


async function getPDFs() {

    const url =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Impossible de récupérer les fichiers GitHub."
        );

    }


    const data =
        await response.json();


    return data.filter(
        file =>

            file.type === "file" &&

            file.name
                .toLowerCase()
                .endsWith(".pdf")
    );

}



/* =========================================================
   NORMALISATION DU TEXTE OCR
   ========================================================= */


function normalizeText(text) {

    return text
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .toLowerCase();

}



/* =========================================================
   EXTRACTION DES DATES
   ========================================================= */


function extractDate(
    text,
    type
) {

    const normalized =
        normalizeText(text);


    let regex;


    if (type === "verified") {

        regex =
            /verif(?:ie|iee|iee|i[eé]?)?\s*le\s*:?\s*(\d{1,2}\s*[\/.-]\s*\d{1,2}\s*[\/.-]\s*\d{4})/i;

    }


    else if (type === "validity") {

        regex =
            /a\s*verifier\s*avant\s*le\s*:?\s*(\d{1,2}\s*[\/.-]\s*\d{1,2}\s*[\/.-]\s*\d{4})/i;

    }


    if (!regex) {

        return "";

    }


    const match =
        normalized.match(regex);


    if (!match) {

        return "";

    }


    return match[1]
        .replace(/\s/g, "")
        .replace(/[.-]/g, "/");

}



/* =========================================================
   OCR D'UNE PAGE PDF
   ========================================================= */


async function ocrPage(
    page
) {

    try {

        const viewport =
            page.getViewport({
                scale: 2
            });


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        if (
            typeof Tesseract ===
            "undefined"
        ) {

            throw new Error(
                "OCR non chargé."
            );

        }


        const result =
            await Tesseract.recognize(

                canvas,

                "fra",

                {

                    logger:
                        function(info) {

                            if (
                                info.status ===
                                "recognizing text"
                            ) {

                                console.log(
                                    "OCR :",
                                    Math.round(
                                        info.progress * 100
                                    ) + "%"
                                );

                            }

                        }

                }

            );


        return result.data.text || "";

    }

    catch (error) {

        console.log(
            "Erreur OCR :",
            error
        );


        return "";

    }

}



/* =========================================================
   LECTURE DU PDF
   ========================================================= */


async function readPDF(
    pdfUrl
) {

    try {

        const response =
            await fetch(
                pdfUrl
            );


        if (!response.ok) {

            throw new Error(
                "PDF inaccessible."
            );

        }


        const data =
            await response.arrayBuffer();


        const pdf =
            await pdfjsLib.getDocument({

                data:
                    data,

                disableWorker:
                    true

            }).promise;


        let completeText =
            "";


        /*
         * On lit les 3 premières pages.
         * Les informations VGP sont généralement
         * présentes sur la première page.
         */


        const maxPages =
            Math.min(
                pdf.numPages,
                3
            );


        for (
            let pageNumber = 1;
            pageNumber <= maxPages;
            pageNumber++
        ) {

            status.textContent =
                "Lecture du PDF — page " +
                pageNumber +
                "/" +
                maxPages +
                "...";


            const page =
                await pdf.getPage(
                    pageNumber
                );


            /*
             * Première tentative :
             * lecture directe du texte.
             */


            try {

                const content =
                    await page.getTextContent();


                const pageText =
                    content.items
                        .map(
                            item => item.str
                        )
                        .join(" ");


                completeText +=
                    " " +
                    pageText;

            }

            catch (error) {

                console.log(
                    "Texte PDF impossible :",
                    error
                );

            }

        }


        /*
         * On cherche d'abord les dates
         * dans le texte directement.
         */


        let verified =
            extractDate(
                completeText,
                "verified"
            );


        let validity =
            extractDate(
                completeText,
                "validity"
            );


        /*
         * Si les dates ne sont pas trouvées,
         * on utilise l'OCR.
         */


        if (
            !verified ||
            !validity
        ) {

            completeText =
                "";


            for (
                let pageNumber = 1;
                pageNumber <= maxPages;
                pageNumber++
            ) {

                status.textContent =
                    "Reconnaissance du texte du PDF — page " +
                    pageNumber +
                    "/" +
                    maxPages +
                    "...";


                const page =
                    await pdf.getPage(
                        pageNumber
                    );


                const ocrText =
                    await ocrPage(
                        page
                    );


                completeText +=
                    " " +
                    ocrText;


                /*
                 * On vérifie après chaque page.
                 * Si les deux dates sont trouvées,
                 * on arrête l'OCR.
                 */


                verified =
                    extractDate(
                        completeText,
                        "verified"
                    );


                validity =
                    extractDate(
                        completeText,
                        "validity"
                    );


                if (
                    verified &&
                    validity
                ) {

                    break;

                }

            }

        }


        return {

            verified:
                verified,

            validity:
                validity

        };

    }

    catch (error) {

        console.log(
            "Impossible de lire le PDF :",
            error
        );


        return {

            verified:
                "",

            validity:
                ""

        };

    }

}



/* =========================================================
   AFFICHAGE DES DOCUMENTS
   ========================================================= */


async function renderFiles() {

    filesContainer.innerHTML =
        "";


    if (
        files.length === 0
    ) {

        status.textContent =
            "Aucun PDF trouvé.";


        return;

    }


    status.textContent =
        files.length +
        " document(s) trouvé(s).";


    for (
        const f of files
    ) {


        const name =
            f.name;


        const fileDiv =
            document.createElement(
                "div"
            );


        fileDiv.className =
            "file";



        const leftDiv =
            document.createElement(
                "div"
            );



        const nameDiv =
            document.createElement(
                "div"
            );


        nameDiv.className =
            "file-name";


        nameDiv.textContent =
            name;



        /*
         * Badge NEW
         */


        const badge =
            document.createElement(
                "span"
            );


        badge.className =
            "new-badge";


        badge.textContent =
            "NEW";


        nameDiv.appendChild(
            badge
        );



        /*
         * Zone des dates
         */


        const validityDiv =
            document.createElement(
                "div"
            );


        validityDiv.className =
            "validity";


        validityDiv.textContent =
            "Lecture des dates...";


        validityDiv.classList.add(
            "loading"
        );



        leftDiv.appendChild(
            nameDiv
        );


        leftDiv.appendChild(
            validityDiv
        );



        /*
         * Bouton téléchargement
         */


        const link =
            document.createElement(
                "a"
            );


        link.className =
            "download-btn";


        link.href =
            fileUrl(
                name
            );


        link.target =
            "_blank";


        link.rel =
            "noopener";


        link.textContent =
            "Télécharger";



        link.onclick =
            function() {

                localStorage.setItem(
                    name,
                    "downloaded"
                );


                badge.remove();

            };



        fileDiv.appendChild(
            leftDiv
        );


        fileDiv.appendChild(
            link
        );


        filesContainer.appendChild(
            fileDiv
        );



        /*
         * Lecture automatique des dates
         */


        const dates =
            await readPDF(
                fileUrl(name)
            );



        validityDiv.classList.remove(
            "loading"
        );


        validityDiv.innerHTML =
            "";



        if (
            dates.verified
        ) {

            validityDiv.innerHTML +=

                "Vérifié le : " +

                dates.verified;

        }



        if (
            dates.validity
        ) {

            if (
                dates.verified
            ) {

                validityDiv.innerHTML +=
                    "<br>";

            }


            validityDiv.innerHTML +=

                "À vérifier avant le : " +

                dates.validity;

        }



        if (
            !dates.verified &&
            !dates.validity
        ) {

            validityDiv.textContent =
                "Dates non disponibles";

        }

    }


    status.textContent =
        files.length +
        " document(s) chargé(s).";

}



/* =========================================================
   RECHERCHE
   ========================================================= */


function searchFiles() {

    const input =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const fileDivs =
        document.getElementsByClassName(
            "file"
        );


    for (
        let i = 0;
        i < fileDivs.length;
        i++
    ) {


        const name =
            fileDivs[i]
                .getElementsByClassName(
                    "file-name"
                )[0]
                .innerText
                .toLowerCase();


        if (
            name.includes(
                input
            )
        ) {

            fileDivs[i].style.display =
                "flex";

        }

        else {

            fileDivs[i].style.display =
                "none";

        }

    }

}



/* =========================================================
   LANCEMENT
   ========================================================= */


async function start() {

    try {

        status.textContent =
            "Recherche des PDF...";


        files =
            await getPDFs();


        await renderFiles();

    }

    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Erreur lors du chargement des documents.";

    }

}


start();

</script>


<!-- =====================================================
     TESSERACT OCR
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


</body>
