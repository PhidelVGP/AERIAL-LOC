<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHIDEL VGP — Documents</title>

<style>

/* =========================================================
   STYLE GÉNÉRAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #17345c;
}

/* =========================================================
   EN-TÊTE
========================================================= */

header {
    background: #ffffff;
    padding: 20px 18px 25px;
    text-align: center;
}

.header-title {
    max-width: 1200px;
    margin: 0 auto 18px;
    min-height: 160px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;

    background: #ffffff;
}

.title {
    color: #e00000;
    font-size: clamp(38px, 6vw, 76px);
    font-weight: 900;
    margin: 0;
    letter-spacing: -2px;
}

/* =========================================================
   ILLUSTRATIONS MACHINES
========================================================= */

.machine {
    font-size: 90px;
    line-height: 1;
    flex-shrink: 0;
}

.forklift {
    transform: scaleX(-1);
}

.lift {
    transform: none;
}

/* =========================================================
   BARRE DE RECHERCHE
========================================================= */

.search-container {
    max-width: 1180px;
    margin: 0 auto;
}

.search {
    width: 100%;
    height: 64px;

    border: 2px solid #d7e1ed;
    border-radius: 18px;

    padding: 0 24px;
    font-size: 19px;

    outline: none;
    background: white;

    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.search:focus {
    border-color: #287be8;
}

/* =========================================================
   ZONE DES DOCUMENTS
========================================================= */

.documents-zone {
    max-width: 1180px;
    margin: 0 auto 35px;

    padding: 30px 24px 35px;

    background: #dff1ff;

    border-radius: 22px;
}

#status {
    text-align: center;
    color: #45688f;
    font-size: 18px;
    margin-bottom: 25px;
}

/* =========================================================
   CARTES PDF
========================================================= */

.card {
    background: #ffffff;

    border-radius: 18px;

    padding: 22px 24px;

    margin-bottom: 18px;

    display: flex;
    align-items: center;
    gap: 22px;

    box-shadow: 0 2px 7px rgba(0,0,0,0.04);

    min-height: 125px;
}

/* =========================================================
   ICÔNE PDF
========================================================= */

.pdf-icon {
    width: 64px;
    height: 76px;

    background: #ffe5e5;

    border-radius: 9px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: #ed2024;

    font-weight: bold;

    flex-shrink: 0;
}

.pdf-icon .symbol {
    font-size: 31px;
    line-height: 1;
}

.pdf-icon .pdf-text {
    font-size: 12px;
    margin-top: 5px;
}

/* =========================================================
   INFORMATIONS
========================================================= */

.info {
    flex: 1;
    min-width: 0;
}

.file-name {
    margin: 0 0 9px;

    color: #122f55;

    font-size: 23px;
    font-weight: 800;

    word-break: break-word;
}

/* =========================================================
   BADGE NEW
========================================================= */

.new-badge {
    display: inline-block;

    background: #f22929;
    color: white;

    padding: 5px 9px;

    margin-left: 8px;

    border-radius: 8px;

    font-size: 12px;
    font-weight: 900;

    vertical-align: middle;
}

/* =========================================================
   DATES
========================================================= */

.dates {
    color: #496886;

    font-size: 16px;
    line-height: 1.65;
}

.dates strong {
    color: #254d76;
}

.loading {
    color: #7891aa;
}

.error {
    color: #d62828;
}

/* =========================================================
   BOUTON TÉLÉCHARGER
========================================================= */

.download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    min-width: 205px;

    padding: 15px 22px;

    border-radius: 13px;

    background: #1677ed;
    color: white;

    text-decoration: none;

    font-size: 17px;
    font-weight: bold;

    flex-shrink: 0;

    transition: 0.15s;
}

.download:hover {
    background: #0866d5;
    transform: translateY(-1px);
}

.download-icon {
    font-size: 21px;
}

/* =========================================================
   AUCUN DOCUMENT
========================================================= */

.empty {
    text-align: center;

    padding: 35px;

    color: #66819d;

    font-size: 18px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .header-title {
        min-height: 115px;
        gap: 10px;
    }

    .machine {
        font-size: 47px;
    }

    .title {
        font-size: 34px;
        letter-spacing: -1px;
    }

    .documents-zone {
        margin-left: 10px;
        margin-right: 10px;

        padding: 20px 12px;
    }

    .card {
        padding: 17px;

        flex-wrap: wrap;

        gap: 13px;
    }

    .info {
        min-width: calc(100% - 82px);
    }

    .download {
        width: 100%;
    }

    .file-name {
        font-size: 19px;
    }

    .dates {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     EN-TÊTE
======================================================= -->

<header>

    <div class="header-title">

        <!-- Chariot élévateur -->
        <div class="machine forklift" aria-label="Chariot élévateur">
            🚜
        </div>

        <!-- Nom -->
        <h1 class="title">
            PHIDEL VGP
        </h1>

        <!-- Nacelle -->
        <div class="machine lift" aria-label="Nacelle">
            🏗️
        </div>

    </div>


    <!-- Recherche -->

    <div class="search-container">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Rechercher un document..."
            autocomplete="off"
        >

    </div>

</header>



<!-- =======================================================
     DOCUMENTS
======================================================= -->

<main class="documents-zone">

    <div id="status">
        Chargement des documents...
    </div>

    <div id="documents"></div>

</main>



<script type="module">

/* =========================================================
   CONFIGURATION
========================================================= */

const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";


/* =========================================================
   ÉLÉMENTS
========================================================= */

const documentsContainer =
    document.getElementById("documents");

const statusElement =
    document.getElementById("status");

const searchElement =
    document.getElementById("search");


/* =========================================================
   PDF.JS
========================================================= */

let pdfjsLib = null;


/* =========================================================
   TESSERACT
========================================================= */

let ocrWorker = null;


/* =========================================================
   LISTE DES FICHIERS
========================================================= */

let files = [];


/* =========================================================
   CHARGER PDF.JS
========================================================= */

async function loadPDFJS() {

    if (pdfjsLib) {
        return pdfjsLib;
    }

    pdfjsLib = await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    return pdfjsLib;
}


/* =========================================================
   CHARGER TESSERACT
========================================================= */

async function getOCRWorker() {

    if (ocrWorker) {
        return ocrWorker;
    }

    if (!window.Tesseract) {

        throw new Error(
            "Tesseract.js n'est pas chargé."
        );
    }

    ocrWorker =
        await window.Tesseract.createWorker("fra");

    return ocrWorker;
}


/* =========================================================
   RÉCUPÉRER AUTOMATIQUEMENT LES PDF
========================================================= */

async function getPDFs() {

    const response =
        await fetch(API);

    if (!response.ok) {

        throw new Error(
            "Impossible de récupérer les fichiers GitHub."
        );
    }

    const data =
        await response.json();


    return data

        .filter(item =>
            item.type === "file" &&
            item.name
                .toLowerCase()
                .endsWith(".pdf")
        )

        .map(item => ({

            name: item.name,
            file: item.name

        }))

        .sort((a, b) =>
            a.name.localeCompare(
                b.name,
                "fr",
                { numeric: true }
            )
        );
}


/* =========================================================
   NORMALISER LE TEXTE OCR
========================================================= */

function normalizeText(text) {

    return text

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /\r/g,
            "\n"
        )

        .replace(
            /[ \t]+/g,
            " "
        );
}


/* =========================================================
   TROUVER UNE DATE
========================================================= */

function findDate(text) {

    const match =
        text.match(
            /\b(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})\b/
        );

    if (!match) {
        return null;
    }

    const day =
        match[1].padStart(2, "0");

    const month =
        match[2].padStart(2, "0");

    const year =
        match[3];

    return `${day}/${month}/${year}`;
}


/* =========================================================
   EXTRAIRE LES DATES
========================================================= */

function extractDates(text) {

    const normalized =
        normalizeText(text);

    const lines =
        normalized
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean);


    let verified = null;
    let validUntil = null;


    /* -------------------------------------------------------
       RECHERCHE LIGNE PAR LIGNE
    ------------------------------------------------------- */

    for (const line of lines) {

        const lower =
            line.toLowerCase();


        /*
         * Vérifié le
         */

        if (
            !verified &&
            lower.includes("verif") &&
            (
                lower.includes("le") ||
                lower.includes("1e")
            )
        ) {

            verified =
                findDate(line);
        }


        /*
         * À vérifier avant le
         */

        if (
            !validUntil &&
            lower.includes("verif") &&
            lower.includes("avant")
        ) {

            validUntil =
                findDate(line);
        }
    }


    /* -------------------------------------------------------
       RECHERCHE PLUS LARGE
    ------------------------------------------------------- */

    if (!verified) {

        const match =
            normalized.match(
                /verif.{0,40}?(?:le|1e).{0,20}?(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{4})/i
            );

        if (match) {

            verified =
                findDate(match[1]);
        }
    }


    if (!validUntil) {

        const match =
            normalized.match(
                /a\s+verif.{0,40}?avant.{0,20}?(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{4})/i
            );

        if (match) {

            validUntil =
                findDate(match[1]);
        }
    }


    return {
        verified,
        validUntil
    };
}


/* =========================================================
   LIRE LE PDF AVEC OCR
========================================================= */

async function readPDF(filename) {

    const pdfjs =
        await loadPDFJS();

    const worker =
        await getOCRWorker();


    const url =
        SITE +
        encodeURIComponent(filename);


    const loadingTask =
        pdfjs.getDocument(url);


    const pdf =
        await loadingTask.promise;


    /*
     * On lit jusqu'à 3 pages maximum.
     */

    const maxPages =
        Math.min(
            pdf.numPages,
            3
        );


    let completeText = "";


    for (
        let pageNumber = 1;
        pageNumber <= maxPages;
        pageNumber++
    ) {

        const page =
            await pdf.getPage(pageNumber);


        const viewport =
            page.getViewport({
                scale: 2
            });


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.width =
            Math.ceil(
                viewport.width
            );

        canvas.height =
            Math.ceil(
                viewport.height
            );


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /*
         * OCR
         */

        const result =
            await worker.recognize(
                canvas
            );


        completeText +=
            "\n" +
            result.data.text;


        /*
         * Si les deux dates sont trouvées,
         * on arrête immédiatement.
         */

        const dates =
            extractDates(
                completeText
            );


        if (
            dates.verified &&
            dates.validUntil
        ) {

            break;
        }
    }


    return extractDates(
        completeText
    );
}


/* =========================================================
   GESTION DU NEW
========================================================= */

/*
 * Le navigateur mémorise les PDF déjà téléchargés.
 *
 * Tant qu'un PDF n'a pas été téléchargé :
 * → NEW reste affiché.
 *
 * Après téléchargement :
 * → NEW disparaît.
 */

function isDownloaded(filename) {

    return localStorage.getItem(
        "phidelvgp_downloaded_" + filename
    ) === "true";
}


function markAsDownloaded(filename) {

    localStorage.setItem(
        "phidelvgp_downloaded_" + filename,
        "true"
    );
}


/* =========================================================
   CRÉER UNE CARTE
========================================================= */

function createCard(file) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";


    /* -------------------------------------------------------
       ICÔNE PDF
    ------------------------------------------------------- */

    const pdfIcon =
        document.createElement(
            "div"
        );

    pdfIcon.className =
        "pdf-icon";

    pdfIcon.innerHTML = `
        <div class="symbol">⌁</div>
        <div class="pdf-text">PDF</div>
    `;


    /* -------------------------------------------------------
       INFORMATIONS
    ------------------------------------------------------- */

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "info";


    const title =
        document.createElement(
            "h2"
        );

    title.className =
        "file-name";

    title.textContent =
        file.name;


    /*
     * NEW apparaît tant que le fichier
     * n'a pas encore été téléchargé.
     */

    if (
        !isDownloaded(
            file.name
        )
    ) {

        const badge =
            document.createElement(
                "span"
            );

        badge.className =
            "new-badge";

        badge.textContent =
            "NEW";

        title.appendChild(
            badge
        );
    }


    /* -------------------------------------------------------
       DATES
    ------------------------------------------------------- */

    const dates =
        document.createElement(
            "div"
        );

    dates.className =
        "dates loading";

    dates.textContent =
        "Lecture des dates…";


    info.appendChild(
        title
    );

    info.appendChild(
        dates
    );


    /* -------------------------------------------------------
       BOUTON
    ------------------------------------------------------- */

    const link =
        document.createElement(
            "a"
        );

    link.className =
        "download";

    link.href =
        SITE +
        encodeURIComponent(
            file.name
        );

    link.target =
        "_blank";

    link.rel =
        "noopener";

    link.innerHTML = `
        <span class="download-icon">⬇</span>
        <span>Télécharger</span>
    `;


    /*
     * Quand l'utilisateur clique,
     * le PDF est considéré comme téléchargé.
     */

    link.addEventListener(
        "click",
        () => {

            markAsDownloaded(
                file.name
            );

            const badge =
                title.querySelector(
                    ".new-badge"
                );

            if (badge) {
                badge.remove();
            }
        }
    );


    /* -------------------------------------------------------
       ASSEMBLAGE
    ------------------------------------------------------- */

    card.appendChild(
        pdfIcon
    );

    card.appendChild(
        info
    );

    card.appendChild(
        link
    );


    documentsContainer.appendChild(
        card
    );


    /* -------------------------------------------------------
       OCR AUTOMATIQUE
    ------------------------------------------------------- */

    readPDF(
        file.file
    )

    .then(result => {

        dates.className =
            "dates";


        let html =
            "";


        if (
            result.verified
        ) {

            html += `
                <div>
                    📅 <strong>Vérifié le :</strong>
                    ${result.verified}
                </div>
            `;
        }


        if (
            result.validUntil
        ) {

            html += `
                <div>
                    📅 <strong>À vérifier avant le :</strong>
                    ${result.validUntil}
                </div>
            `;
        }


        if (!html) {

            html = `
                <div>
                    Dates non disponibles
                </div>
            `;
        }


        dates.innerHTML =
            html;

    })

    .catch(error => {

        console.error(
            "Erreur OCR :",
            file.name,
            error
        );


        dates.className =
            "dates error";

        dates.textContent =
            "Dates non disponibles";
    });


    return card;
}


/* =========================================================
   AFFICHER LES DOCUMENTS
========================================================= */

function displayFiles(list) {

    documentsContainer.innerHTML =
        "";


    if (!list.length) {

        documentsContainer.innerHTML = `
            <div class="empty">
                Aucun document trouvé.
            </div>
        `;

        return;
    }


    list.forEach(
        file => createCard(file)
    );
}


/* =========================================================
   RECHERCHE
========================================================= */

searchElement.addEventListener(
    "input",
    () => {

        const query =
            searchElement.value
                .trim()
                .toLowerCase();


        const filtered =
            files.filter(
                file =>
                    file.name
                        .toLowerCase()
                        .includes(query)
            );


        displayFiles(
            filtered
        );
    }
);


/* =========================================================
   DÉMARRAGE
========================================================= */

async function start() {

    try {

        statusElement.textContent =
            "Recherche des documents…";


        files =
            await getPDFs();


        displayFiles(
            files
        );


        statusElement.textContent =
            `${files.length} document(s) trouvé(s).`;


    }

    catch (error) {

        console.error(
            error
        );


        statusElement.textContent =
            "Impossible de charger les documents.";


        documentsContainer.innerHTML = `
            <div class="empty">
                Impossible de charger les documents.
                Vérifie que le dépôt GitHub est public
                et que GitHub Pages est activé.
            </div>
        `;
    }
}


/* =========================================================
   LANCEMENT
========================================================= */

start();

</script>

</body>
