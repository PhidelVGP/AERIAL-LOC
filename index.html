<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHIDEL VGP — Documents</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#183247;
}

/* =========================
   HEADER
========================= */

header{
    position:relative;
    overflow:hidden;
    background:#fff;
    padding:28px 20px 35px;
    text-align:center;
}

.logo{
    position:relative;
    z-index:2;
    margin:10px 0 28px;
    color:#e30613;
    font-size:44px;
    font-weight:900;
    letter-spacing:2px;
    animation:logoIn .8s ease-out;
}

/* =========================
   ILLUSTRATIONS
========================= */

.machine{
    position:absolute;
    top:15px;
    width:190px;
    height:125px;
    z-index:1;
}

.machine.left{
    left:2%;
    animation:enterLeft 1s ease-out, floatLeft 3s ease-in-out 1s infinite;
}

.machine.right{
    right:2%;
    animation:enterRight 1s ease-out, floatRight 3.2s ease-in-out 1s infinite;
}

/* CHARIOT */

.fork-body{
    position:absolute;
    left:45px;
    bottom:18px;
    width:85px;
    height:42px;
    background:#f4c400;
    border-radius:8px;
}

.fork-seat{
    position:absolute;
    left:83px;
    bottom:58px;
    width:25px;
    height:22px;
    background:#252525;
    border-radius:4px;
}

.fork-pillar1,
.fork-pillar2{
    position:absolute;
    bottom:77px;
    width:5px;
    height:40px;
    background:#333;
}

.fork-pillar1{left:75px}
.fork-pillar2{left:112px}

.fork-top{
    position:absolute;
    left:75px;
    bottom:112px;
    width:42px;
    height:5px;
    background:#333;
}

.fork1,
.fork2{
    position:absolute;
    left:13px;
    width:50px;
    height:5px;
    background:#333;
}

.fork1{bottom:17px}
.fork2{bottom:8px}

.fork-wheel{
    position:absolute;
    bottom:0;
    width:24px;
    height:24px;
    background:#222;
    border-radius:50%;
}

.fork-wheel.one{left:53px}
.fork-wheel.two{left:113px}

/* NACELLE */

.lift-base{
    position:absolute;
    right:38px;
    bottom:18px;
    width:82px;
    height:32px;
    background:#f39c12;
    border-radius:8px;
}

.lift-wheel{
    position:absolute;
    bottom:1px;
    width:21px;
    height:21px;
    background:#222;
    border-radius:50%;
}

.lift-wheel.one{right:92px}
.lift-wheel.two{right:38px}

.lift-boom1{
    position:absolute;
    right:85px;
    bottom:45px;
    width:18px;
    height:78px;
    background:#f39c12;
    border-radius:5px;
    transform:rotate(-25deg);
    transform-origin:bottom;
}

.lift-boom2{
    position:absolute;
    right:49px;
    bottom:90px;
    width:18px;
    height:72px;
    background:#f39c12;
    border-radius:5px;
    transform:rotate(55deg);
    transform-origin:bottom;
}

.lift-platform{
    position:absolute;
    right:4px;
    top:0;
    width:52px;
    height:25px;
    background:#f39c12;
    border-radius:5px;
}

.lift-person{
    position:absolute;
    right:19px;
    top:-18px;
    width:13px;
    height:20px;
    background:#333;
    border-radius:50%;
}

/* =========================
   RECHERCHE
========================= */

.search-container{
    max-width:850px;
    margin:auto;
    animation:searchIn .8s .25s both;
}

#search{
    width:100%;
    height:60px;
    padding:0 26px;
    border:2px solid #d8e2ea;
    border-radius:32px;
    outline:none;
    font-size:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    transition:.25s;
}

#search:focus{
    border-color:#1683d8;
    box-shadow:0 6px 22px rgba(22,131,216,.18);
}

/* =========================
   DOCUMENTS
========================= */

.documents-area{
    min-height:550px;
    padding:38px 20px 65px;
    background:#dff1ff;
    border-radius:38px 38px 0 0;
}

.documents-title{
    margin:0 0 30px;
    text-align:center;
    color:#16496e;
    font-size:30px;
    animation:fadeUp .7s .35s both;
}

#documents{
    max-width:930px;
    margin:auto;
}

.document-card{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:17px;
    padding:20px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    animation:cardIn .5s both;
    transition:.2s;
}

.document-card:hover{
    transform:translateY(-3px);
    box-shadow:0 9px 25px rgba(0,0,0,.12);
}

.pdf-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:58px;
    height:68px;
    border-radius:10px;
    background:#e30613;
    color:#fff;
    font-weight:900;
}

.document-info{
    flex:1;
}

.document-name{
    margin-bottom:8px;
    font-size:19px;
    font-weight:800;
    word-break:break-word;
}

.date{
    margin:4px 0;
    color:#52616d;
    font-size:14px;
}

.new-badge{
    display:inline-block;
    margin-left:8px;
    padding:5px 9px;
    border-radius:20px;
    background:#e30613;
    color:#fff;
    font-size:11px;
    font-weight:bold;
}

.download{
    padding:13px 20px;
    border-radius:12px;
    background:#1683d8;
    color:white;
    text-decoration:none;
    font-weight:bold;
    white-space:nowrap;
    transition:.2s;
}

.download:hover{
    background:#096bb5;
    transform:scale(1.03);
}

.loading{
    padding:50px 10px;
    text-align:center;
    color:#555;
}

.error{
    padding:40px;
    text-align:center;
    color:#c00;
    font-weight:bold;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes logoIn{
    from{opacity:0;transform:scale(.8)}
    to{opacity:1;transform:scale(1)}
}

@keyframes searchIn{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes enterLeft{
    from{opacity:0;transform:translateX(-130px)}
    to{opacity:1;transform:translateX(0)}
}

@keyframes enterRight{
    from{opacity:0;transform:translateX(130px)}
    to{opacity:1;transform:translateX(0)}
}

@keyframes floatLeft{
    0%,100%{translate:0 0}
    50%{translate:5px -3px}
}

@keyframes floatRight{
    0%,100%{translate:0 0}
    50%{translate:-4px -3px}
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding-top:25px;
    }

    .logo{
        margin-bottom:100px;
        font-size:31px;
    }

    .machine{
        top:60px;
        transform:scale(.72);
    }

    .machine.left{
        left:-30px;
    }

    .machine.right{
        right:-30px;
    }

    .document-card{
        flex-wrap:wrap;
    }

    .document-info{
        min-width:calc(100% - 80px);
    }

    .download{
        width:100%;
        text-align:center;
    }

    .documents-area{
        padding:30px 12px 50px;
        border-radius:25px 25px 0 0;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<header>

    <!-- CHARIOT ÉLÉVATEUR -->
    <div class="machine left">

        <div class="fork-body"></div>
        <div class="fork-seat"></div>

        <div class="fork-pillar1"></div>
        <div class="fork-pillar2"></div>
        <div class="fork-top"></div>

        <div class="fork1"></div>
        <div class="fork2"></div>

        <div class="fork-wheel one"></div>
        <div class="fork-wheel two"></div>

    </div>

    <!-- LOGO -->
    <div class="logo">
        PHIDEL VGP
    </div>

    <!-- NACELLE ÉLÉVATRICE -->
    <div class="machine right">

        <div class="lift-base"></div>

        <div class="lift-wheel one"></div>
        <div class="lift-wheel two"></div>

        <div class="lift-boom1"></div>
        <div class="lift-boom2"></div>

        <div class="lift-platform"></div>
        <div class="lift-person"></div>

    </div>

    <!-- RECHERCHE -->
    <div class="search-container">

        <input
            id="search"
            type="text"
            placeholder="Rechercher un document..."
            autocomplete="off"
        >

    </div>

</header>


<section class="documents-area">

    <h1 class="documents-title">
        Documents disponibles
    </h1>

    <div id="documents">
        <div class="loading">
            Chargement des documents...
        </div>
    </div>

</section>


<script type="module">

const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";

const documentsContainer =
    document.getElementById("documents");

const searchInput =
    document.getElementById("search");

let documents = [];

let ocrWorker = null;


/* =========================
   NOM DU PDF
========================= */

function cleanName(filename){

    return filename
        .replace(/\.pdf$/i,"")
        .trim();

}


/* =========================
   FILTRAGE
========================= */

function filterDocuments(){

    const search =
        searchInput.value
            .toLowerCase()
            .trim();

    if(!search){
        return documents;
    }

    return documents.filter(doc =>
        doc.name
            .toLowerCase()
            .includes(search)
    );
}


/* =========================
   AFFICHAGE
========================= */

function displayDocuments(list){

    documentsContainer.innerHTML = "";

    if(list.length === 0){

        documentsContainer.innerHTML =
            `<div class="loading">
                Aucun document trouvé.
            </div>`;

        return;
    }

    list.forEach((doc,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "document-card";

        card.style.animationDelay =
            (index * .05) + "s";


        const downloaded =
            localStorage.getItem(
                "phidelvgp_downloaded_" + doc.name
            ) === "true";


        const badge =
            downloaded
            ? ""
            : `<span class="new-badge">NEW</span>`;


        const verified =
            doc.verified ||
            "date non disponible";


        const nextCheck =
            doc.nextCheck ||
            "date non disponible";


        const pdfURL =
            SITE +
            encodeURIComponent(doc.name);


        card.innerHTML = `

            <div class="pdf-icon">
                PDF
            </div>

            <div class="document-info">

                <div class="document-name">
                    ${cleanName(doc.name)}
                    ${badge}
                </div>

                <div class="date">
                    Vérifié le : ${verified}
                </div>

                <div class="date">
                    À vérifier avant le : ${nextCheck}
                </div>

            </div>

            <a
                class="download"
                href="${pdfURL}"
                download="${doc.name}"
            >
                Télécharger
            </a>

        `;


        card
            .querySelector(".download")
            .addEventListener("click",()=>{

                localStorage.setItem(
                    "phidelvgp_downloaded_" + doc.name,
                    "true"
                );

                const newBadge =
                    card.querySelector(".new-badge");

                if(newBadge){
                    newBadge.remove();
                }

            });


        documentsContainer.appendChild(card);

    });
}


/* =========================
   OCR DES DATES
========================= */

async function readDates(url){

    try{

        if(!ocrWorker){

            ocrWorker =
                await window.Tesseract.createWorker("fra");

        }


        const pdfjsLib =
            await import(
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            );


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const pdf =
            await pdfjsLib
                .getDocument(url)
                .promise;


        let verified = null;
        let nextCheck = null;


        const pages =
            Math.min(pdf.numPages,3);


        for(
            let pageNumber = 1;
            pageNumber <= pages;
            pageNumber++
        ){

            const page =
                await pdf.getPage(pageNumber);


            const viewport =
                page.getViewport({
                    scale:1.5
                });


            const canvas =
                document.createElement("canvas");


            const context =
                canvas.getContext("2d");


            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;


            await page.render({

                canvasContext:context,
                viewport:viewport

            }).promise;


            const result =
                await ocrWorker.recognize(canvas);


            const text =
                result.data.text
                    .replace(/\n+/g," ")
                    .replace(/\s+/g," ");


            const verifiedMatch =
                text.match(
                    /Vérifié\s*le\s*:?\s*(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/i
                );


            const nextMatch =
                text.match(
                    /[ÀA]\s*vérifier\s*avant\s*le\s*:?\s*(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/i
                );


            if(verifiedMatch){

                verified =
                    verifiedMatch[1]
                        .replace(/\./g,"/")
                        .replace(/-/g,"/");

            }


            if(nextMatch){

                nextCheck =
                    nextMatch[1]
                        .replace(/\./g,"/")
                        .replace(/-/g,"/");

            }


            if(verified && nextCheck){
                break;
            }

        }


        return {
            verified,
            nextCheck
        };


    }catch(error){

        console.log("OCR :",error);

        return {
            verified:null,
            nextCheck:null
        };

    }

}


/* =========================
   CHARGEMENT DES PDF
========================= */

async function loadDocuments(){

    try{

        const response =
            await fetch(API);


        if(!response.ok){
            throw new Error("GitHub inaccessible");
        }


        const files =
            await response.json();


        documents =
            files
                .filter(file =>
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".pdf")
                )
                .map(file => ({

                    name:file.name,
                    verified:null,
                    nextCheck:null

                }));


        displayDocuments(documents);


        /* Lecture automatique des dates */

        for(const doc of documents){

            const url =
                SITE +
                encodeURIComponent(doc.name);


            const dates =
                await readDates(url);


            doc.verified =
                dates.verified;


            doc.nextCheck =
                dates.nextCheck;


            displayDocuments(
                filterDocuments()
            );

        }


    }catch(error){

        console.error(error);


        documentsContainer.innerHTML = `

            <div class="error">

                Impossible de charger les documents.

                <br><br>

                Vérifie que le dépôt GitHub est public.

            </div>

        `;

    }

}


/* =========================
   RECHERCHE
========================= */

searchInput.addEventListener(
    "input",
    () => {

        displayDocuments(
            filterDocuments()
        );

    }
);


/* =========================
   TESSERACT
========================= */

const tesseract =
    document.createElement("script");

tesseract.src =
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

tesseract.onload =
    () => {
        loadDocuments();
    };

tesseract.onerror =
    () => {

        documentsContainer.innerHTML = `

            <div class="error">

                Impossible de charger le système
                de lecture des documents.

            </div>

        `;

    };

document.head.appendChild(tesseract);

</script>

</body>
</html>
