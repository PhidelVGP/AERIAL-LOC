<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phidel VGP — Documents</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

header {
    background: #ffffff;
    padding: 25px 20px 20px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

h1 {
    margin: 0 0 18px;
    font-size: 30px;
}

.search {
    width: 100%;
    max-width: 600px;
    padding: 15px 18px;
    font-size: 17px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
}

.search:focus {
    border-color: #2563eb;
}

#status {
    text-align: center;
    padding: 15px;
    color: #6b7280;
}

#documents {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 15px 40px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.card h2 {
    margin: 0 0 12px;
    font-size: 21px;
}

.new {
    display: inline-block;
    margin-left: 8px;
    padding: 4px 8px;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    vertical-align: middle;
}

.dates {
    color: #4b5563;
    line-height: 1.7;
    margin-bottom: 15px;
}

.download {
    display: inline-block;
    text-decoration: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 9px;
    font-weight: bold;
}

.download:hover {
    background: #1d4ed8;
}

.loading {
    color: #6b7280;
}

.error {
    color: #dc2626;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
}
</style>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>

<!-- Tesseract.js -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<header>
    <h1>Phidel VGP</h1>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Rechercher un document..."
        autocomplete="off"
    >
</header>

<div id="status">
    Chargement des documents...
</div>

<div id="documents"></div>


<script type="module">

/* =========================================================
   CONFIGURATION
========================================================= */

const SITE = "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";


/* =========================================================
   ÉLÉMENTS DE LA PAGE
========================================================= */

const documentsContainer = document.getElementById("documents");
const statusElement = document.getElementById("status");
const searchElement = document.getElementById("search");


/* =========================================================
   LISTE DES PDF
========================================================= */

let files = [];


/* =========================================================
   RÉCUPÉRER AUTOMATIQUEMENT LES PDF SUR GITHUB
========================================================= */

async function getPDFs() {

    const response = await fetch(API);

    if (!response.ok) {
        throw new Error("Impossible de récupérer les fichiers GitHub.");
    }

    const data = await response.json();

    return data
        .filter(item =>
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".pdf")
        )
        .map(item => ({
            name: item.name,
            file: item.name
        }))
        .sort((a, b) =>
            a.name.localeCompare(b.name, "fr", {
                numeric: true
            })
        );
}


/* =========================================================
   EXTRAIRE LES DATES D'UN TEXTE OCR
========================================================= */

function normalizeText(text) {

    return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\r/g, "\n")
        .replace(/[ \t]+/g, " ");
}


/* =========================================================
   TROUVER UNE DATE DANS UNE LIGNE
========================================================= */

function findDate(text) {

    const match = text.match(
        /\b(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})\b/
    );

    if (!match) {
        return null;
    }

    const day = match[1].padStart(2, "0");
    const month = match[2].padStart(2, "0");
    const year = match[3];

    return `${day}/${month}/${year}`;
}


/* =========================================================
   ANALYSER LE TEXTE OCR
========================================================= */

function extractDates(text) {

    const normalized = normalizeText(text);

    const lines = normalized
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);

    let verified = null;
    let validUntil = null;


    for (const line of lines) {

        const lower = line.toLowerCase();


        /*
         * Vérifié le
         */

        if (
            !verified &&
            lower.includes("verif") &&
            (
                lower.includes("le") ||
                lower.includes("1e")
            )
        ) {
            verified = findDate(line);
        }


        /*
         * À vérifier avant le
         */

        if (
            !validUntil &&
            lower.includes("verif") &&
            lower.includes("avant")
        ) {
            validUntil = findDate(line);
        }
    }


    /*
     * Deuxième recherche plus large
     * si l'OCR a mal séparé les lignes.
     */

    if (!verified) {

        const match = normalized.match(
            /verif.{0,30}?(?:le|1e).{0,15}?(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{4})/i
        );

        if (match) {
            verified = findDate(match[1]);
        }
    }


    if (!validUntil) {

        const match = normalized.match(
            /a\s+verif.{0,30}?avant.{0,15}?(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{4})/i
        );

        if (match) {
            validUntil = findDate(match[1]);
        }
    }


    return {
        verified,
        validUntil
    };
}


/* =========================================================
   CHARGER PDF.JS
========================================================= */

let pdfjsLib;


/*
 * On importe PDF.js ici afin d'être certain
 * qu'il est chargé avant de commencer l'OCR.
 */

async function loadPDFJS() {

    if (pdfjsLib) {
        return pdfjsLib;
    }

    pdfjsLib = await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    return pdfjsLib;
}


/* =========================================================
   WORKER TESSERACT
========================================================= */

let ocrWorker = null;

let ocrWorkerPromise = null;


/*
 * On utilise UN SEUL worker Tesseract
 * et on le réutilise pour tous les PDF.
 */

async function getOCRWorker() {

    if (ocrWorker) {
        return ocrWorker;
    }

    if (ocrWorkerPromise) {
        return ocrWorkerPromise;
    }

    ocrWorkerPromise = (async () => {

        if (!window.Tesseract) {
            throw new Error("Tesseract n'est pas chargé.");
        }

        const worker =
            await Tesseract.createWorker("fra");

        ocrWorker = worker;

        return worker;

    })();

    return ocrWorkerPromise;
}


/* =========================================================
   OCR DU PDF
========================================================= */

async function readPDF(filename) {

    const pdfjs = await loadPDFJS();

    const worker = await getOCRWorker();


    const url =
        SITE + encodeURIComponent(filename);


    const loadingTask =
        pdfjs.getDocument(url);

    const pdf =
        await loadingTask.promise;


    /*
     * On commence par la première page.
     * C'est normalement là que se trouvent
     * les informations VGP.
     */

    const maxPages =
        Math.min(pdf.numPages, 3);


    let completeText = "";


    for (let pageNumber = 1;
         pageNumber <= maxPages;
         pageNumber++) {


        const page =
            await pdf.getPage(pageNumber);


        /*
         * Une échelle de 2 permet généralement
         * d'avoir une image suffisamment nette
         * pour l'OCR.
         */

        const viewport =
            page.getViewport({
                scale: 2
            });


        const canvas =
            document.createElement("canvas");


        const context =
            canvas.getContext("2d");


        canvas.width =
            Math.ceil(viewport.width);

        canvas.height =
            Math.ceil(viewport.height);


        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        /*
         * OCR de la page.
         */

        const result =
            await worker.recognize(canvas);


        completeText +=
            "\n" + result.data.text;


        /*
         * Si les deux dates sont déjà trouvées,
         * inutile de continuer à scanner.
         */

        const dates =
            extractDates(completeText);


        if (
            dates.verified &&
            dates.validUntil
        ) {
            break;
        }
    }


    return extractDates(completeText);
}


/* =========================================================
   AFFICHER UNE CARTE
========================================================= */

function createCard(file) {

    const card =
        document.createElement("div");

    card.className = "card";


    const title =
        document.createElement("h2");

    title.textContent =
        file.name;


    /*
     * Badge NEW pour les nouveaux documents.
     */

    if (file.isNew) {

        const badge =
            document.createElement("span");

        badge.className = "new";

        badge.textContent = "NEW";

        title.appendChild(badge);
    }


    const dates =
        document.createElement("div");

    dates.className = "dates loading";

    dates.textContent =
        "Lecture des dates…";


    /*
     * LIEN DIRECT VERS LE PDF
     */

    const link =
        document.createElement("a");

    link.className = "download";

    link.textContent =
        "Télécharger";

    link.target =
        "_blank";

    link.rel =
        "noopener";

    link.href =
        SITE + encodeURIComponent(file.name);


    card.appendChild(title);
    card.appendChild(dates);
    card.appendChild(link);

    documentsContainer.appendChild(card);


    /*
     * OCR lancé automatiquement.
     */

    readPDF(file.file)
        .then(result => {

            dates.className = "dates";


            let html = "";


            if (result.verified) {

                html +=
                    `<div>📅 <strong>Vérifié le :</strong> ${result.verified}</div>`;
            }


            if (result.validUntil) {

                html +=
                    `<div>📅 <strong>À vérifier avant le :</strong> ${result.validUntil}</div>`;
            }


            if (!html) {

                html =
                    `<div>Dates non disponibles</div>`;
            }


            dates.innerHTML =
                html;

        })
        .catch(error => {

            console.error(
                "Erreur OCR :",
                file.name,
                error
            );


            dates.className =
                "dates error";

            dates.textContent =
                "Dates non disponibles";
        });


    return card;
}


/* =========================================================
   AFFICHER TOUS LES DOCUMENTS
========================================================= */

function displayFiles(list) {

    documentsContainer.innerHTML = "";


    if (!list.length) {

        documentsContainer.innerHTML =
            `<div class="empty">
                Aucun document trouvé.
            </div>`;

        return;
    }


    list.forEach(file => {
        createCard(file);
    });
}


/* =========================================================
   RECHERCHE
========================================================= */

searchElement.addEventListener(
    "input",
    () => {

        const query =
            searchElement.value
                .trim()
                .toLowerCase();


        const filtered =
            files.filter(file =>
                file.name
                    .toLowerCase()
                    .includes(query)
            );


        displayFiles(filtered);
    }
);


/* =========================================================
   DÉMARRAGE
========================================================= */

async function start() {

    try {

        statusElement.textContent =
            "Recherche des documents…";


        files =
            await getPDFs();


        /*
         * Les cartes apparaissent immédiatement.
         */

        displayFiles(files);


        statusElement.textContent =
            `${files.length} document(s) trouvé(s).`;


    } catch (error) {

        console.error(error);


        statusElement.textContent =
            "Impossible de charger les documents.";


        documentsContainer.innerHTML =
            `<div class="empty">
                Vérifie que le dépôt GitHub est public
                et que GitHub Pages est activé.
            </div>`;
    }
}


start();

</script>

</body>
</html>
