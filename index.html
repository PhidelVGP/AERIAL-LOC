<script type="module">

/* =========================================================
   CONFIGURATION
========================================================= */

const SITE =
    "https://phidelvgp.github.io/AERIAL-LOC/";

const API =
    "https://api.github.com/repos/PhidelVGP/AERIAL-LOC/contents/?ref=main";

const container =
    document.getElementById("documents");

const search =
    document.getElementById("search");

let documents = [];

let ocrWorker = null;


/* =========================================================
   NETTOYAGE DU NOM
========================================================= */

function cleanName(name){

    return name
        .replace(/\.pdf$/i,"")
        .trim();

}


/* =========================================================
   RECHERCHE
========================================================= */

function filteredDocuments(){

    const q =
        search.value
            .toLowerCase()
            .trim();

    if(!q){
        return documents;
    }

    return documents.filter(doc =>
        doc.name
            .toLowerCase()
            .includes(q)
    );

}


/* =========================================================
   AFFICHAGE
========================================================= */

function displayDocuments(list){

    container.innerHTML = "";

    if(!list.length){

        container.innerHTML =
            `<div class="loading">
                Aucun document trouvé.
            </div>`;

        return;
    }


    list.forEach((doc,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "document-card";

        card.style.animationDelay =
            `${index * .04}s`;


        const downloaded =
            localStorage.getItem(
                "phidelvgp_downloaded_" + doc.name
            ) === "true";


        const badge =
            downloaded
            ? ""
            : `<span class="new-badge">NEW</span>`;


        const verified =
            doc.verified ||
            "date non disponible";


        const nextCheck =
            doc.nextCheck ||
            "date non disponible";


        const url =
            SITE +
            encodeURIComponent(doc.name);


        card.innerHTML = `

            <div class="pdf-icon">
                PDF
            </div>

            <div class="document-info">

                <div class="document-name">
                    ${cleanName(doc.name)}
                    ${badge}
                </div>

                <div class="date">
                    Vérifié le : ${verified}
                </div>

                <div class="date">
                    À vérifier avant le : ${nextCheck}
                </div>

            </div>

            <a
                class="download"
                href="${url}"
                download="${doc.name}"
            >
                Télécharger
            </a>

        `;


        card
            .querySelector(".download")
            .addEventListener("click",()=>{

                localStorage.setItem(
                    "phidelvgp_downloaded_" + doc.name,
                    "true"
                );

                const badgeElement =
                    card.querySelector(".new-badge");

                if(badgeElement){
                    badgeElement.remove();
                }

            });


        container.appendChild(card);

    });

}


/* =========================================================
   RECHERCHE DE DATES DANS LE TEXTE PDF
========================================================= */

function extractDates(text){

    if(!text){
        return {
            verified:null,
            nextCheck:null
        };
    }


    const clean =
        text
            .replace(/\u00a0/g," ")
            .replace(/[|]/g," ")
            .replace(/\s+/g," ");


    /*
       On accepte plusieurs formes :

       Vérifié le : 11/08/2026
       Vérifie le : 11/08/2026
       Verifie le : 11-08-2026
       Vérifié : 11/08/2026
    */

    const verifiedRegex =
        /v[ée]rifi[ée]?\s*(?:le)?\s*:?\s*(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{2,4})/i;


    /*
       À vérifier avant le : 11/02/2027
       A vérifier avant le : 11/02/2027
       Vérification suivante : ...
    */

    const nextRegex =
        /[àa]\s*v[ée]rifier\s*avant\s*(?:le)?\s*:?\s*(\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{2,4})/i;


    let verified = null;
    let nextCheck = null;


    const a =
        clean.match(verifiedRegex);

    const b =
        clean.match(nextRegex);


    if(a){
        verified =
            normalizeDate(a[1]);
    }


    if(b){
        nextCheck =
            normalizeDate(b[1]);
    }


    return {
        verified,
        nextCheck
    };

}


/* =========================================================
   NORMALISATION DATE
========================================================= */

function normalizeDate(value){

    return value
        .replace(/\s/g,"")
        .replace(/\./g,"/")
        .replace(/-/g,"/");

}


/* =========================================================
   PDF.JS : LECTURE DU TEXTE NATIF
========================================================= */

async function readNativePDFText(url){

    try{

        const pdfjsLib =
            await import(
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            );


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const pdf =
            await pdfjsLib
                .getDocument(url)
                .promise;


        let completeText = "";


        /*
           On lit jusqu'à 10 pages.
           Beaucoup de rapports VGP ont les dates
           sur les premières pages.
        */

        const maxPages =
            Math.min(pdf.numPages,10);


        for(
            let pageNumber = 1;
            pageNumber <= maxPages;
            pageNumber++
        ){

            const page =
                await pdf.getPage(pageNumber);


            const content =
                await page.getTextContent();


            const pageText =
                content.items
                    .map(item => item.str)
                    .join(" ");


            completeText +=
                " " + pageText;


            const dates =
                extractDates(completeText);


            if(
                dates.verified &&
                dates.nextCheck
            ){

                return {
                    ...dates,
                    pdf
                };

            }

        }


        return {
            ...extractDates(completeText),
            pdf
        };


    }catch(error){

        console.log(
            "Lecture texte PDF impossible:",
            error
        );

        return {
            verified:null,
            nextCheck:null,
            pdf:null
        };

    }

}


/* =========================================================
   OCR
========================================================= */

async function readOCR(url,pdf){

    try{

        if(!pdf){
            return {
                verified:null,
                nextCheck:null
            };
        }


        if(!ocrWorker){

            ocrWorker =
                await window.Tesseract.createWorker("fra");

        }


        let verified = null;
        let nextCheck = null;


        /*
           OCR des 6 premières pages.
           On augmente la résolution pour les scans.
        */

        const maxPages =
            Math.min(pdf.numPages,6);


        for(
            let pageNumber = 1;
            pageNumber <= maxPages;
            pageNumber++
        ){

            const page =
                await pdf.getPage(pageNumber);


            const viewport =
                page.getViewport({
                    scale:2.2
                });


            const canvas =
                document.createElement("canvas");


            const ctx =
                canvas.getContext("2d");


            canvas.width =
                Math.floor(viewport.width);

            canvas.height =
                Math.floor(viewport.height);


            await page.render({

                canvasContext:ctx,
                viewport

            }).promise;


            /*
               Amélioration du scan :
               fond blanc + contraste.
            */

            const image =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            const data =
                image.data;


            for(
                let i=0;
                i<data.length;
                i+=4
            ){

                const grey =
                    (
                        data[i] * .299 +
                        data[i+1] * .587 +
                        data[i+2] * .114
                    );


                const value =
                    grey > 175
                    ? 255
                    : grey < 90
                    ? 0
                    : grey;


                data[i] =
                    value;

                data[i+1] =
                    value;

                data[i+2] =
                    value;

            }


            ctx.putImageData(
                image,
                0,
                0
            );


            const result =
                await ocrWorker.recognize(canvas);


            const text =
                result.data.text
                    .replace(/\n+/g," ")
                    .replace(/\s+/g," ");


            const dates =
                extractDates(text);


            if(dates.verified){
                verified =
                    dates.verified;
            }


            if(dates.nextCheck){
                nextCheck =
                    dates.nextCheck;
            }


            if(
                verified &&
                nextCheck
            ){

                break;

            }

        }


        return {
            verified,
            nextCheck
        };


    }catch(error){

        console.log(
            "OCR impossible:",
            error
        );

        return {
            verified:null,
            nextCheck:null
        };

    }

}


/* =========================================================
   LECTURE COMPLÈTE D'UN PDF
========================================================= */

async function readPDFDates(url){

    /*
       ÉTAPE 1 :
       texte directement présent dans le PDF
    */

    const native =
        await readNativePDFText(url);


    if(
        native.verified &&
        native.nextCheck
    ){

        return {
            verified:native.verified,
            nextCheck:native.nextCheck
        };

    }


    /*
       ÉTAPE 2 :
       OCR si le PDF est un scan
    */

    const ocr =
        await readOCR(
            url,
            native.pdf
        );


    return {

        verified:
            native.verified ||
            ocr.verified,

        nextCheck:
            native.nextCheck ||
            ocr.nextCheck

    };

}


/* =========================================================
   CHARGEMENT DES PDF GITHUB
========================================================= */

async function loadDocuments(){

    try{

        const response =
            await fetch(API);


        if(!response.ok){

            throw new Error(
                "GitHub inaccessible"
            );

        }


        const files =
            await response.json();


        /*
           IMPORTANT :
           les PDF sont à la racine du dépôt.
        */

        documents =
            files
                .filter(file =>
                    file.type === "file" &&
                    /\.pdf$/i.test(file.name)
                )
                .map(file => ({

                    name:file.name,
                    verified:null,
                    nextCheck:null

                }));


        displayDocuments(
            documents
        );


        /*
           Lecture des dates PDF par PDF.
        */

        for(
            const doc of documents
        ){

            const url =
                SITE +
                encodeURIComponent(
                    doc.name
                );


            const dates =
                await readPDFDates(
                    url
                );


            doc.verified =
                dates.verified;


            doc.nextCheck =
                dates.nextCheck;


            /*
               Mise à jour immédiate
               de la carte.
            */

            displayDocuments(
                filteredDocuments()
            );

        }


    }catch(error){

        console.error(error);


        container.innerHTML = `

            <div class="error">

                Impossible de charger les documents.

                <br><br>

                Vérifie que le dépôt GitHub
                est bien public.

            </div>

        `;

    }

}


/* =========================================================
   RECHERCHE
========================================================= */

search.addEventListener(
    "input",
    () => {

        displayDocuments(
            filteredDocuments()
        );
